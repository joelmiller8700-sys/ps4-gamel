name: Build PS4 3D Horror Game

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld fonts-dejavu-core

      - name: Download OpenOrbis toolchain
        run: |
          curl -sL https://api.github.com/repos/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/latest -o rel.json
          URL=$(grep browser_download_url rel.json | grep -i 'tar.gz' | head -1 | cut -d '"' -f4)
          curl -L -o toolchain.tar.gz "$URL"
          mkdir -p toolchain
          tar -xzf toolchain.tar.gz -C toolchain

      - name: Generate Arabic text images
        run: |
          mkdir -p $GITHUB_WORKSPACE/gen
          pip install pillow arabic-reshaper python-bidi || true
          python3 gen_ar.py $GITHUB_WORKSPACE/gen/ar_data.h || echo '#define NO_ARABIC 1' > $GITHUB_WORKSPACE/gen/ar_data.h
          head -c 200 $GITHUB_WORKSPACE/gen/ar_data.h

      - name: Build game
        run: |
          H=$(find toolchain -path '*orbis/libkernel.h' | head -1)
          export OO_PS4_TOOLCHAIN=$PWD/$(dirname $(dirname $(dirname $H)))
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          export DOTNET_ROLL_FORWARD=Major
          chmod +x $OO_PS4_TOOLCHAIN/bin/linux/* || true
          cp -r $OO_PS4_TOOLCHAIN/samples samples
          rm -rf samples/game
          cp -r samples/input samples/game
          mv samples/game/input samples/game/game
          rm -rf samples/game/assets
          cp main.cpp samples/game/game/main.cpp
          cp gen/ar_data.h samples/game/game/ar_data.h
          cd samples/game
          sed -i 's/^TITLE[ ]*:=.*/TITLE       := Nightmare Cellar 3D/' Makefile
          sed -i 's/^TITLE_ID[ ]*:=.*/TITLE_ID    := BREW00092/' Makefile
          sed -i 's/^CONTENT_ID[ ]*:=.*/CONTENT_ID  := IV0000-BREW00092_00-NIGHTMARE3D00000/' Makefile
          make
          mkdir -p $GITHUB_WORKSPACE/out
          find . -name '*.pkg' -exec cp {} $GITHUB_WORKSPACE/out/ \;
          ls -la $GITHUB_WORKSPACE/out
          test -n "$(ls $GITHUB_WORKSPACE/out)"

      - name: Upload result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nightmare-cellar-3d
          path: out/*.pkg
